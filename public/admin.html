<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGUL ARENA — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --gold: #C9991A;
    --gold-light: #E8B520;
    --gold-dim: rgba(201,153,26,0.15);
    --bg: #03050A;
    --bg2: #080C14;
    --bg3: #0D1220;
    --border: rgba(201,153,26,0.2);
    --text: #EEF0F5;
    --muted: #7A8499;
    --danger: #E05252;
    --success: #2ECC8F;
    --info: #4A9EE0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }

  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,153,26,0.08) 0%, transparent 70%);
  }

  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    width: 380px;
    text-align: center;
  }

  .login-logo { font-size: 22px; font-weight: 800; letter-spacing: 6px; color: var(--gold); margin-bottom: 6px; }
  .login-sub { font-size: 11px; letter-spacing: 3px; color: var(--muted); margin-bottom: 32px; font-family: 'DM Mono', monospace; }
  .login-box h2 { font-size: 18px; font-weight: 600; margin-bottom: 24px; }

  .login-box input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: var(--gold); }

  .btn-gold {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-gold:hover { opacity: 0.9; }

  .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; font-family: 'DM Mono', monospace; }

  #dashboard { display: none; }

  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo { font-size: 16px; font-weight: 800; letter-spacing: 4px; color: var(--gold); }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .topbar-time { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

  .btn-sm {
    background: var(--gold-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--gold);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-sm:hover { background: rgba(201,153,26,0.25); }

  .btn-danger {
    background: transparent;
    border: 1px solid rgba(224,82,82,0.3);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--danger);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 32px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .kpi-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  .kpi-icon { font-size: 20px; margin-bottom: 12px; }
  .kpi-value { font-size: 36px; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .kpi-label { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 1px; }
  .kpi-sub { font-size: 11px; color: var(--success); margin-top: 6px; font-family: 'DM Mono', monospace; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }

  .detail-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .detail-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 20px; color: var(--text); }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { font-size: 13px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .detail-val { font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

  .bar-chart { margin-top: 8px; }
  .bar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 3px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .bar-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gold); width: 24px; flex-shrink: 0; }

  .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: 'DM Mono', monospace; font-weight: 500; }
  .badge-success { background: rgba(46,204,143,0.15); color: var(--success); }
  .badge-info    { background: rgba(74,158,224,0.15); color: var(--info); }
  .badge-warn    { background: var(--gold-dim); color: var(--gold); }
  .badge-danger  { background: rgba(224,82,82,0.15); color: var(--danger); }

  /* USERS TABLE */
  .users-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    width: 280px;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--gold); }
  .search-box::placeholder { color: var(--muted); }

  .users-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .table-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    overflow-x: auto;
  }

  table { width: 100%; border-collapse: collapse; }

  thead tr { background: var(--bg3); }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--gold); }

  td {
    padding: 12px 16px;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    white-space: nowrap;
    font-family: 'DM Mono', monospace;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(201,153,26,0.03); }

  td.name { font-family: 'Syne', sans-serif; font-weight: 600; color: var(--text); }
  td.email { color: var(--info); }
  td.muted { color: var(--muted); }

  .pulse { display: inline-block; width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; margin-right: 6px; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  .genere-le { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-align: right; margin-top: 16px; }

  .loading { text-align: center; padding: 48px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .detail-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 16px; }
    .tabs { padding: 0 16px; overflow-x: auto; }
    .topbar { padding: 0 16px; }
    .search-box { width: 100%; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">REGUL ARENA</div>
    <div class="login-sub">ADMIN DASHBOARD</div>
    <h2>Connexion Admin</h2>
    <input type="text" id="login-token" placeholder="Colle ton token JWT ici...">
    <button class="btn-gold" onclick="doLogin()">ACCÉDER →</button>
    <div class="login-error" id="login-error">Token invalide ou accès refusé</div>
    <div style="margin-top:16px;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace">
      DevTools → Console → <code style="color:var(--gold)">copy(localStorage.getItem('ra_jwt'))</code>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">REGUL ARENA <span style="color:var(--muted);font-size:12px;letter-spacing:2px;margin-left:8px">ADMIN</span></div>
    <div class="topbar-right">
      <span class="pulse"></span>
      <span class="topbar-time" id="live-time"></span>
      <button class="btn-sm" onclick="refreshAll()">↻ Actualiser</button>
      <button class="btn-danger" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('stats')">📊 Statistiques</div>
    <div class="tab" onclick="switchTab('users')">👥 Utilisateurs</div>
  </div>

  <div class="main">
    <!-- TAB STATS -->
    <div id="tab-stats" class="tab-content active">
      <div id="stats-content">
        <div class="loading"><div class="spinner"></div><br>Chargement...</div>
      </div>
    </div>

    <!-- TAB USERS -->
    <div id="tab-users" class="tab-content">
      <div id="users-content">
        <div class="loading"><div class="spinner"></div><br>Chargement des utilisateurs...</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://www.regularena.com';
let token = null;
let allUsers = [];

function updateTime() {
  document.getElementById('live-time').textContent = new Date().toLocaleString('fr-FR', {
    timeZone: 'Africa/Dakar', hour:'2-digit', minute:'2-digit', second:'2-digit'
  }) + ' DAK';
}
setInterval(updateTime, 1000);
updateTime();

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['stats','users'][i] === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'users' && allUsers.length === 0) loadUsers();
}

async function doLogin() {
  let t = document.getElementById('login-token').value.trim();
  t = t.replace(/^['"`]|['"`]$/g, '').trim();
  if (!t) { showError('Entre ton token JWT'); return; }
  try {
    const r = await fetch(`${API}/admin/stats`, { headers: { 'Authorization': 'Bearer ' + t } });
    if (r.status === 403 || r.status === 401) { showError('Accès refusé — token invalide ou non admin'); return; }
    if (!r.ok) { showError('Erreur serveur : ' + r.status); return; }
    token = t;
    localStorage.setItem('ra_admin_token', t);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderStats(await r.json());
  } catch(e) { showError('Erreur de connexion'); }
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function logout() {
  token = null;
  allUsers = [];
  localStorage.removeItem('ra_admin_token');
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-token').value = '';
}

async function refreshAll() {
  loadStats();
  if (allUsers.length > 0) loadUsers();
}

async function loadStats() {
  if (!token) return;
  document.getElementById('stats-content').innerHTML = '<div class="loading"><div class="spinner"></div><br>Actualisation...</div>';
  try {
    const r = await fetch(`${API}/admin/stats`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { logout(); return; }
    renderStats(await r.json());
  } catch(e) {
    document.getElementById('stats-content').innerHTML = '<div class="loading">Erreur de chargement</div>';
  }
}

async function loadUsers() {
  if (!token) return;
  document.getElementById('users-content').innerHTML = '<div class="loading"><div class="spinner"></div><br>Chargement des utilisateurs...</div>';
  try {
    const r = await fetch(`${API}/admin/users`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { document.getElementById('users-content').innerHTML = '<div class="loading">Route /admin/users non disponible — ajoute-la dans index.js</div>'; return; }
    const d = await r.json();
    allUsers = d.users || [];
    renderUsers(allUsers);
  } catch(e) {
    document.getElementById('users-content').innerHTML = '<div class="loading">Erreur de chargement</div>';
  }
}

function renderUsers(users) {
  const html = `
    <div class="users-header">
      <div>
        <div class="section-title">Liste des utilisateurs</div>
        <div class="users-count">${users.length} résultat(s)</div>
      </div>
      <input class="search-box" id="user-search" placeholder="🔍  Rechercher nom, email, pays..." oninput="filterUsers(this.value)">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Pays</th>
            <th>Profil</th>
            <th>Établissement</th>
            <th>Statut</th>
            <th>Rôle</th>
            <th>Inscrit le</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          ${users.map(u => userRow(u)).join('')}
        </tbody>
      </table>
    </div>
    <div class="genere-le">Total : ${allUsers.length} utilisateurs</div>
  `;
  document.getElementById('users-content').innerHTML = html;
}

function userRow(u) {
  const date = u.created_at ? new Date(u.created_at).toLocaleDateString('fr-FR') : '—';
  const verified = u.email_verified ? '<span class="badge badge-success">✓ vérifié</span>' : '<span class="badge badge-danger">✗ non vérifié</span>';
  const role = u.role === 'admin' ? '<span class="badge badge-warn">admin</span>' : '<span class="badge" style="color:var(--muted)">user</span>';
  return `<tr>
    <td class="muted">#${u.id}</td>
    <td class="name">${esc(u.name)}</td>
    <td class="email">${esc(u.email)}</td>
    <td class="muted">${u.country || '—'}</td>
    <td class="muted">${u.profile || '—'}</td>
    <td class="muted">${esc(u.etablissement) || '—'}</td>
    <td>${verified}</td>
    <td>${role}</td>
    <td class="muted">${date}</td>
  </tr>`;
}

function filterUsers(q) {
  const s = q.toLowerCase().trim();
  const filtered = s ? allUsers.filter(u =>
    (u.name||'').toLowerCase().includes(s) ||
    (u.email||'').toLowerCase().includes(s) ||
    (u.country||'').toLowerCase().includes(s) ||
    (u.etablissement||'').toLowerCase().includes(s)
  ) : allUsers;
  document.getElementById('users-tbody').innerHTML = filtered.map(u => userRow(u)).join('');
  document.querySelector('.users-count').textContent = `${filtered.length} résultat(s)`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderStats(d) {
  const u = d.utilisateurs || {};
  const duels = d.duels || {};
  const scores = d.scores || {};
  const tournois = d.tournois || {};
  const fb = d.feedback || {};
  const t2027 = d.tournoi_2027 || {};
  const parPays = u.par_pays || [];
  const parProfil = u.par_profil || [];
  const maxPays = Math.max(...parPays.map(p => p.n), 1);

  document.getElementById('stats-content').innerHTML = `
    <div class="section-title">Vue d'ensemble</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon">👤</div>
        <div class="kpi-value">${u.total ?? 0}</div>
        <div class="kpi-label">Utilisateurs</div>
        <div class="kpi-sub">+${u.nouveaux_7j ?? 0} cette semaine</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">✅</div>
        <div class="kpi-value">${u.verifies ?? 0}</div>
        <div class="kpi-label">Vérifiés</div>
        <div class="kpi-sub">${u.total ? Math.round((u.verifies/u.total)*100) : 0}% du total</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">⚔️</div>
        <div class="kpi-value">${duels.total ?? 0}</div>
        <div class="kpi-label">Duels</div>
        <div class="kpi-sub">${duels.actifs ?? 0} actifs · ${duels.termines ?? 0} terminés</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">🎯</div>
        <div class="kpi-value">${scores.total ?? 0}</div>
        <div class="kpi-label">Scores</div>
        <div class="kpi-sub">&nbsp;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">🏆</div>
        <div class="kpi-value">${tournois.total ?? 0}</div>
        <div class="kpi-label">Tournois</div>
        <div class="kpi-sub">&nbsp;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">💬</div>
        <div class="kpi-value">${fb.total ?? 0}</div>
        <div class="kpi-label">Feedbacks</div>
        <div class="kpi-sub">&nbsp;</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon">🔔</div>
        <div class="kpi-value">${t2027.inscrits_notif ?? 0}</div>
        <div class="kpi-label">Notif 2027</div>
        <div class="kpi-sub">&nbsp;</div>
      </div>
    </div>

    <div class="section-title">Détails</div>
    <div class="detail-grid">
      <div class="detail-card">
        <h3>🌍 Par pays</h3>
        <div class="bar-chart">
          ${parPays.length === 0
            ? '<div style="color:var(--muted);font-size:13px;font-family:DM Mono,monospace">Aucune donnée</div>'
            : parPays.map(p => `
              <div class="bar-item">
                <div class="bar-label">${p.country || '??'}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round((p.n/maxPays)*100)}%"></div></div>
                <div class="bar-count">${p.n}</div>
              </div>
            `).join('')}
        </div>
      </div>
      <div class="detail-card">
        <h3>🎓 Par profil</h3>
        ${parProfil.length === 0
          ? '<div style="color:var(--muted);font-size:13px;font-family:DM Mono,monospace">Aucune donnée</div>'
          : parProfil.map(p => `
            <div class="detail-row">
              <div class="detail-key">${p.profile || 'inconnu'}</div>
              <div class="detail-val">${p.n} <span class="badge badge-warn">${u.total ? Math.round((p.n/u.total)*100) : 0}%</span></div>
            </div>
          `).join('')}
      </div>
      <div class="detail-card">
        <h3>⚔️ Activité Duels</h3>
        <div class="detail-row"><div class="detail-key">Total créés</div><div class="detail-val">${duels.total ?? 0}</div></div>
        <div class="detail-row"><div class="detail-key">En cours</div><div class="detail-val"><span class="badge badge-success">${duels.actifs ?? 0} actifs</span></div></div>
        <div class="detail-row"><div class="detail-key">Terminés</div><div class="detail-val">${duels.termines ?? 0}</div></div>
        <div class="detail-row"><div class="detail-key">En attente</div><div class="detail-val">${Math.max(0,(duels.total??0)-(duels.actifs??0)-(duels.termines??0))}</div></div>
      </div>
      <div class="detail-card">
        <h3>📊 Activité Générale</h3>
        <div class="detail-row"><div class="detail-key">Scores enregistrés</div><div class="detail-val">${scores.total ?? 0}</div></div>
        <div class="detail-row"><div class="detail-key">Tournois créés</div><div class="detail-val">${tournois.total ?? 0}</div></div>
        <div class="detail-row"><div class="detail-key">Feedbacks reçus</div><div class="detail-val">${fb.total ?? 0}</div></div>
        <div class="detail-row"><div class="detail-key">Inscrits notif 2027</div><div class="detail-val"><span class="badge badge-info">${t2027.inscrits_notif ?? 0}</span></div></div>
      </div>
    </div>
    <div class="genere-le">Données au ${new Date(d.genere_le).toLocaleString('fr-FR', {timeZone:'Africa/Dakar'})} (Dakar)</div>
  `;
}

// Auto-login
window.addEventListener('load', () => {
  const saved = localStorage.getItem('ra_admin_token');
  if (saved) { document.getElementById('login-token').value = saved; doLogin(); }
});

// Auto-refresh 60s
setInterval(() => { if (token) loadStats(); }, 60000);

// Enter
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
